name: Build app

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "debug (installable) or release (unsigned, minified)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        if: ${{ inputs.build_type == 'debug' }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release APK
        if: ${{ inputs.build_type == 'release' }}
        run: ./gradlew :app:renameReleaseApk --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrismPlayer-${{ inputs.build_type }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/PrismPlayer-*.apk
          if-no-files-found: error

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
